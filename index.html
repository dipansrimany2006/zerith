    <meta name="theme-color" content="#050608" />
    <script>
      // Apply the theme before first paint so there is no flash. Light is the default; dark only when chosen.
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('zerith-theme')
        } catch (e) {}
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      })()
    </script>
